name: CodeQL

on:
  pull_request:
    branches:
      - remake
  push:
    branches:
      - remake
  schedule:
    - cron: '30 2 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust and Linux dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
          rustup toolchain install 1.88.0 --profile minimal

      - name: Initialize CodeQL
        uses: github/codeql-action/init@717e230604b28efc38d8b4d3737d0611b16bc19a # v3.30.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild Rust
        if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@717e230604b28efc38d8b4d3737d0611b16bc19a # v3.30.0

      - name: Analyze
        uses: github/codeql-action/analyze@717e230604b28efc38d8b4d3737d0611b16bc19a # v3.30.0
        with:
          category: /language:${{ matrix.language }}
