[package]
name = "tiktools-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin Winit/Wry desktop host for TikTools"

[features]
default = ["persistence", "plugin-install", "http"]
devtools = ["wry/devtools"]
plugin-install = ["tiktools-core/plugin-install"]
persistence = ["tiktools-core/persistence"]
http = ["tiktools-core/http"]

[dependencies]
tiktools-core = { path = "../tiktools-core", features = ["native-tiktok"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
percent-encoding = "2.3"
url = "2.5"
winit = "0.30"
wry = { version = "0.56", features = ["tracing"] }
tray-icon = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
